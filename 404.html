  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%232F6A55'/><text x='50' y='62' font-size='38' text-anchor='middle' fill='%23ffffff' font-family='serif'>ॐ</text></svg>">

    <!-- Pre-render Theme Initialization (Prevents FOUC / Theme Flash) -->
  <script>
    (function() {
      try {
        const saved = (localStorage.getItem('prana-theme') || localStorage.getItem('stackly-theme'));
        const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved ? saved : (sysDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

<!-- Bootstrap 5 & Icons -->
